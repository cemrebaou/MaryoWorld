<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Maryo World</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  /* sahne: telefon dik tutulursa kodla 90 derece cevrilir (oyun hep yatay) */
  #sahne { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; transform-origin: 0 0;
           display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #oyun { display: block; background: #000; touch-action: none; }
  /* dokunmatik dugmeler: telefonda eskisinin ~2 kati. Hepsi tek sirada ve ekranin alt %28'inde (zemin kusagi) kalir */
  #sahne { --d: min(22vmin, 124px); }
  .dugme { position: absolute; width: var(--d); height: var(--d); bottom: 3vmin;
           border-radius: 50%; border: 1.5px solid rgba(200, 222, 232, 0.28);
           background: rgba(120, 150, 165, 0.07); touch-action: none; cursor: pointer;
           display: flex; align-items: center; justify-content: center; }
  .dugme.bas { background: rgba(160, 200, 220, 0.22); border-color: rgba(220, 238, 246, 0.6); }
  .dugme svg { width: 42%; height: 42%; fill: none; stroke: rgba(210, 230, 240, 0.55); stroke-width: 2.4;
               stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #dSol { left: 3vmin; }
  #dSag { left: calc(var(--d) + 5vmin); }
  #dZip { right: 3vmin; }
  #dEgil { right: calc(var(--d) + 5vmin); }
  #dEtk { right: calc(var(--d) * 2 + 7vmin); }
  /* etkilesim menzilindeyken parlar */
  #dEtk.var { border-color: rgba(255, 215, 150, 0.9); background: rgba(255, 190, 110, 0.20); }
  #dEtk.var svg { stroke: rgba(255, 225, 175, 0.95); }
  #dTam { right: 2.5vmin; top: 2.5vmin; bottom: auto; width: 9vmin; height: 9vmin; min-width: 40px; min-height: 40px; border-radius: 22%; }
  /* bolum dugmeleri: ustte ortada, 1-5 */
  #bolumler { position: absolute; top: 1.6vmin; left: 50%; transform: translateX(-50%); display: flex; gap: 0.8vmin; }
  #bolumler button { width: 6vmin; height: 6vmin; min-width: 26px; min-height: 26px; max-width: 40px; max-height: 40px; border-radius: 22%;
                     border: 1.5px solid rgba(200, 222, 232, 0.28); background: rgba(120, 150, 165, 0.07);
                     color: rgba(214, 228, 236, 0.6); font: 300 14px "Segoe UI", Roboto, Arial, sans-serif; cursor: pointer; padding: 0; touch-action: manipulation; }
  #bolumler button.secili { border-color: rgba(255, 200, 130, 0.9); color: rgba(255, 214, 170, 0.95); background: rgba(255, 190, 110, 0.14); }
  #bolumler button.kilitli { opacity: 0.3; cursor: default; }
</style>
</head>
<body>
<div id="sahne">
  <canvas id="oyun"></canvas>
  <div class="dugme" id="dSol"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
  <div class="dugme" id="dSag"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
  <div class="dugme" id="dEgil"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></div>
  <div class="dugme" id="dEtk"><svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 013 0V11m0-1.5a1.5 1.5 0 013 0V12m0-.5a1.5 1.5 0 013 0V15a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L5 14.5a1.5 1.5 0 012.5-1.6L9 14.5V11"/></svg></div>
  <div class="dugme" id="dZip"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></div>
  <div id="bolumler"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button>10</button></div>
  <div class="dugme" id="dTam"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></div>
</div>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/art.js"></script>
<script src="js/level.js"></script>
<script src="js/robot.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
